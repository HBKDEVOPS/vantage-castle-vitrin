<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="804" viewBox="0 0 1200 804" role="img" aria-labelledby="t d">
  <title id="t">Vantage Castle mimarisi</title>
  <desc id="d">Veri kaynakları birim, tarih ve lisans kontrolünden geçip ölçüm veritabanına yazılır. Emtia Marj Motoru ölçüm katmanından iki yöntemle marj hesaplar; iki yöntemin hesabı ve bandı (alt – üst), gerçekleşen marjla farkıyla kayda geçer. Makro ve Operasyonel henüz hesapta değil. Sektör başına seçim kuralı, aralık ve yedek kural 2026 Ç4'ten itibaren planlıdır, ekranda henüz yoktur. Sunum yalnız ölçüm katmanından ve motor kaydından okur; menüde Panom, Değişimler, Şirketler, Projeksiyon, Sektörler, Emtia, Harita, KAP, Veri ve Ayarlar vardır, Tarama genel arama kutusundan açılır. Geliştirme, insan onaylı bir yapay zekâ ajan ekibiyle yapılır.</desc>
  <defs>
    <marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a8a93"/>
    </marker>
  </defs>
  <style>
    text{font-family:"Martian Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;fill:#e8e6e3}
    .bas{font-size:17px;font-weight:700}
    .alt{font-size:13px;fill:#8a8a93}
    .etk{font-size:12px;fill:#8a8a93;letter-spacing:.08em}
    .ad{font-size:13px;fill:#e8e6e3}
    .plan{font-size:12px;fill:#e8e6e3;letter-spacing:.08em}
    .kutu{fill:#131316;stroke:#3a3a42;stroke-width:1.5}
    .vurgu{fill:#131316;stroke:#ff9e18;stroke-width:1.5}
    .ekip{fill:none;stroke:#3a3a42;stroke-width:1.5;stroke-dasharray:6 6}
    .cizgi{stroke:#8a8a93;stroke-width:1.5;fill:none}
    .ayrac{stroke:#3a3a42;stroke-width:1}
  </style>
  <rect width="1200" height="804" fill="#0d0d0f"/>

  <text x="40" y="44" class="etk">VERİ AKIŞI</text>

  <!-- 1. kaynaklar -->
  <rect x="40" y="64" width="330" height="128" rx="6" class="kutu"/>
  <text x="62" y="100" class="bas">Veri kaynakları</text>
  <text x="62" y="128" class="alt">resmî emtia ve kur serileri,</text>
  <text x="62" y="150" class="alt">faiz ve enflasyon,</text>
  <text x="62" y="172" class="alt">şirket finansalları</text>

  <!-- 2. kayıt ve kontrol -->
  <rect x="435" y="64" width="330" height="128" rx="6" class="kutu"/>
  <text x="457" y="100" class="bas">Kayıt ve kontrol</text>
  <text x="457" y="128" class="alt">birim ve tarih kontrolü,</text>
  <text x="457" y="150" class="alt">her satıra kaynak ve lisans,</text>
  <text x="457" y="172" class="alt">tek ölçüm veritabanı</text>

  <!-- 3. ölçüm -->
  <rect x="830" y="64" width="330" height="128" rx="6" class="kutu"/>
  <text x="852" y="100" class="bas">Ölçüm katmanı</text>
  <text x="852" y="128" class="alt">girdi ve çıktı endeksi,</text>
  <text x="852" y="150" class="alt">fiyat–maliyet farkı,</text>
  <text x="852" y="172" class="alt">gerçekleşen brüt marj</text>

  <line x1="370" y1="128" x2="433" y2="128" class="cizgi" marker-end="url(#ok)"/>
  <line x1="765" y1="128" x2="828" y2="128" class="cizgi" marker-end="url(#ok)"/>
  <line x1="995" y1="192" x2="995" y2="246" class="cizgi" marker-end="url(#ok)"/>

  <!-- 4. motor (tek vurgu); seçim kuralı, aralık ve yedek kural planlı satırında -->
  <rect x="40" y="248" width="1120" height="198" rx="6" class="vurgu"/>
  <text x="62" y="284" class="bas">Emtia Marj Motoru</text>
  <text x="290" y="284" class="alt">(Projeksiyon)</text>
  <text x="62" y="316" class="ad">Emtia fiyatından</text>
  <text x="62" y="338" class="alt">girdi sepeti ve çıktı fiyatı</text>
  <text x="600" y="316" class="ad">Şirket finansallarından</text>
  <text x="600" y="338" class="alt">kalem payları ve stok süresi</text>
  <line x1="62" y1="358" x2="1138" y2="358" class="ayrac"/>
  <text x="62" y="384" class="alt">iki yöntemin hesabı ve bandı (alt – üst), gerçekleşen marjla farkıyla kayda geçer</text>
  <text x="62" y="406" class="alt">Makro ve Operasyonel: henüz hesapta değil</text>
  <text x="62" y="428" class="alt"><tspan class="plan">PLANLI (2026 Ç4)</tspan>  ekranda henüz yok: sektör başına seçim kuralı, aralık ve yedek kural</text>

  <line x1="600" y1="446" x2="600" y2="500" class="cizgi" marker-end="url(#ok)"/>

  <!-- 5. sunum: Ayarlar ve Tarama -->
  <rect x="40" y="502" width="1120" height="126" rx="6" class="kutu"/>
  <text x="62" y="538" class="bas">Sunum</text>
  <text x="62" y="566" class="alt">Panom · Değişimler · Şirketler · Projeksiyon · Sektörler · Emtia · Harita · KAP · Veri · Ayarlar</text>
  <text x="62" y="588" class="alt">Tarama: menüde yok, genel arama kutusundan açılır</text>
  <text x="62" y="610" class="alt">yalnız ölçüm katmanından ve motor kaydından okur; kaynak ve lisanslar Veri › Kaynak sayfasında</text>

  <!-- 6. ekip -->
  <text x="40" y="670" class="etk">GELİŞTİRME</text>
  <rect x="40" y="686" width="1120" height="104" rx="6" class="ekip"/>
  <text x="62" y="722" class="bas">Yapay zekâ ajan ekibi, insan son sözle</text>
  <text x="62" y="750" class="alt">plan → üretim → bağımsız denetim → yerel kayıt</text>
  <text x="62" y="772" class="alt">her iş planla başlar; üreten kendi işini onaylamaz; dışarı giden her adım insanda</text>
</svg>
