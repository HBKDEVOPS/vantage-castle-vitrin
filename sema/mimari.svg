<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
  <title id="t">Vantage Castle mimarisi</title>
  <desc id="d">Veri kaynakları, zamanlanmış veri hattından geçip ölçüm veritabanına yazılır; sunum katmanı yalnız ölçüm veritabanından okur. Geliştirme, insan onaylı bir yapay zekâ ajan ekibiyle yapılır.</desc>
  <defs>
    <marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a8a93"/>
    </marker>
  </defs>
  <style>
    text{font-family:"Martian Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;fill:#e8e6e3}
    .bas{font-size:17px;font-weight:700}
    .alt{font-size:13px;fill:#8a8a93}
    .etk{font-size:12px;fill:#8a8a93;letter-spacing:.08em}
    .kutu{fill:#131316;stroke:#3a3a42;stroke-width:1.5}
    .vurgu{fill:#131316;stroke:#ff9e18;stroke-width:1.5}
    .ekip{fill:none;stroke:#3a3a42;stroke-width:1.5;stroke-dasharray:6 6}
    .cizgi{stroke:#8a8a93;stroke-width:1.5;fill:none}
  </style>
  <rect width="1200" height="560" fill="#0d0d0f"/>

  <text x="40" y="44" class="etk">VERİ AKIŞI</text>

  <!-- 1. kaynaklar -->
  <rect x="40" y="64" width="330" height="128" rx="6" class="kutu"/>
  <text x="62" y="100" class="bas">Veri kaynakları</text>
  <text x="62" y="128" class="alt">emtia ve kur serileri,</text>
  <text x="62" y="150" class="alt">faiz ve enflasyon,</text>
  <text x="62" y="172" class="alt">şirket finansalları</text>

  <!-- 2. veri hattı -->
  <rect x="435" y="64" width="330" height="128" rx="6" class="kutu"/>
  <text x="457" y="100" class="bas">Veri hattı</text>
  <text x="457" y="128" class="alt">günlük ve aylık zamanlı işler;</text>
  <text x="457" y="150" class="alt">birim ve tarih kontrolü,</text>
  <text x="457" y="172" class="alt">her satıra kaynak kaydı</text>

  <!-- 3. ölçüm -->
  <rect x="830" y="64" width="330" height="128" rx="6" class="vurgu"/>
  <text x="852" y="100" class="bas">Ölçüm katmanı</text>
  <text x="852" y="128" class="alt">girdi ve çıktı endeksi,</text>
  <text x="852" y="150" class="alt">fiyat–maliyet farkı,</text>
  <text x="852" y="172" class="alt">gerçekleşen brüt marj</text>

  <line x1="370" y1="128" x2="433" y2="128" class="cizgi" marker-end="url(#ok)"/>
  <line x1="765" y1="128" x2="828" y2="128" class="cizgi" marker-end="url(#ok)"/>
  <line x1="995" y1="192" x2="995" y2="246" class="cizgi" marker-end="url(#ok)"/>

  <!-- 4. sunum -->
  <rect x="40" y="248" width="1120" height="104" rx="6" class="kutu"/>
  <text x="62" y="284" class="bas">Sunum</text>
  <text x="62" y="312" class="alt">Şirket · Emtia · Projeksiyon · Değişimler · Harita · Panom · Sektörler</text>
  <text x="62" y="334" class="alt">yalnız ölçüm katmanından okur; her sayının yanında kaynağı yazar</text>

  <!-- 5. ekip -->
  <text x="40" y="408" class="etk">GELİŞTİRME</text>
  <rect x="40" y="424" width="1120" height="104" rx="6" class="ekip"/>
  <text x="62" y="460" class="bas">Yapay zekâ ajan ekibi, insan son sözle</text>
  <text x="62" y="488" class="alt">plan → üretim → bağımsız denetim → yerel kayıt</text>
  <text x="62" y="510" class="alt">her iş planla başlar; üreten kendi işini onaylamaz; dışarı giden her adım insanda</text>
</svg>
